[package]
name = "rust2-pub"
description = "Audit which pub items another crate needs, and validate narrowing the rest"
version = "0.0.0"
edition = "2024"
license = "MIT OR Apache-2.0"
repository = "https://github.com/kixel-ai/rust2"
# Distributed through the flake: it only builds on the pinned nightly.
publish = false

[package.metadata.rust-analyzer]
rustc_private = true

[dependencies]
rust2-driver = { path = ".." }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"

[lints]
workspace = true
