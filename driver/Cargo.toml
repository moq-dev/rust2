[package]
name = "rust2-driver"
description = "The rustc driver front end that rust2's drivers share"
version = "0.0.0"
edition = "2024"
license = "MIT OR Apache-2.0"
repository = "https://github.com/kixel-ai/rust2"
# A path dependency of the drivers: it only builds on
# their pinned nightly.
publish = false

[package.metadata.rust-analyzer]
rustc_private = true

[dependencies]

[lints]
workspace = true

# Its own workspace, apart from the repo's, on the drivers' nightly: rust-toolchain.toml
# links ts's pin, which flake.nix reads.
[workspace]
members = ["pub"]

[workspace.lints.clippy]
# Every suppression says why, so the next lint audit can judge it.
allow_attributes_without_reason = "warn"
