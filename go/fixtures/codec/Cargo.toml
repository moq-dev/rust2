[package]
name = "codec"
description = "moq-net's sync codec, rust2-ts's fixture, to test rust2-go against native Rust"
version = "0.0.0"
edition = "2024"
license = "MIT OR Apache-2.0"
publish = false

# Used by the sources `#[path]` reaches in ts/fixtures/codec, which cargo-shear does not follow.
[package.metadata.cargo-shear]
ignored = ["bytes", "tracing"]

[features]
# moq-net gates its async codec on this; the vendored subset leaves it off.
async = []

[dependencies]
bytes = "1.11.1"
thiserror = "2.0.21"
tracing = "0.1.44"

[lints]
workspace = true
