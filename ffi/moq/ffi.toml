package = "moq-ffi"
prefix = "moq"

# moq-net, and each package below, exported into one library through the stand-in for
# moq-ffi's remainder that `just ffi standin` writes, which builds with them all.
[crates.moq-net]
# What the export refuses at the pinned revision, as `just ffi census` lists it: the API
# a hand-written wrapper still has to cover.
exclude = [
    "BoundsExceeded",
    "Client::connect",
    "Consume",
    "DecodeError",
    "Driver",
    "IntoBytes",
    "InvalidEpoch",
    "Path::from_static",
    "Path::parts",
    "Server::accept",
    "Server::accept_request",
    "Timed",
    "Timestamp::as_micros",
    "Timestamp::as_millis",
    "Timestamp::as_nanos",
    "Timestamp::as_scale",
    "announce::Announce",
    "announce::Consumer::poll_synced",
    "auth::EmptyToken",
    "broadcast::Lister::poll_unwanted",
    "broadcast::Lister::poll_wanted",
    "bytes",
    "frame::Buffer",
    "frame::Producer::group",
    "goaway::Consumer::poll",
    "group::Consumer::poll_read_frames",
    "group::Consumer::read_frames",
    "group::Producer::write_frames",
    "origin::Requesting",
    "server::Handshake",
    "time::Driver",
    "track::Fetching",
    "track::Resolving",
    "track::Subscribing",
    "transport::Error",
    "transport::memory::Chunks",
    "transport::memory::SendStream",
    "transport::poll::AcceptBi",
    "transport::poll::AcceptUni",
    "transport::poll::Boxable",
    "transport::poll::Buffered",
    "transport::poll::BufferedLease",
    "transport::poll::Chunks",
    "transport::poll::Lease",
    "transport::poll::OpenBi",
    "transport::poll::OpenUni",
    "transport::poll::ReadChunk",
    "transport::poll::RecvDatagram",
    "transport::poll::RecvStream",
    "transport::poll::SendClosed",
    "transport::poll::SendGroup",
    "transport::poll::SendOptions",
    "transport::poll::SendStream",
    "transport::poll::Session",
    "transport::poll::SessionClosed",
    "transport::poll::Ungrouped",
    "transport::poll::Write",
    "transport::poll::WriteBuf",
    "transport::poll::WriteChunk",
    "varint::decode_quic",
    "varint::encode_quic",
]

[crates.moq-net.rename]
# The rule makes both this type and `Session::stats` `moq_session_stats`.
"session::Stats" = "session_stats_snapshot"
# The rule makes both this type and `Path::relative` `moq_path_relative`.
"path::Relative" = "relative"

# Exported with moq-net, whose signatures name its types, such as `Patterns`.
[crates.moq-pattern]
exclude = ["Pattern::captures"]

