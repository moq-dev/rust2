[crates.moq-tokio.rename]
# The rule names these and moq-net's `Client`, `Server`, and `Error` alike.
"Client" = "tokio_client"
"Server" = "tokio_server"
"Error" = "tokio_error"
# The rule makes both this enum and `ConnectError` `moq_connect_error`.
"connect::Error" = "connect_target_error"
# The rule makes both this type and `Connection::monitor` `moq_connection_monitor`.
"connection::Monitor" = "monitor"
# The rule makes each of these fields and the method of its name, which resolves its
# default, `moq_backoff_<field>`.
"field@Backoff::initial" = "backoff_initial_setting"
"field@Backoff::max" = "backoff_max_setting"
"field@Backoff::timeout" = "backoff_timeout_setting"

[crates.hang]
exclude = [
    "Catalog::contributions",
    "Catalog::from_reader",
    "Catalog::subscribe",
    "catalog::Audio::enabled",
    "catalog::Audio::renditions",
    "catalog::Binary::tracks",
    "catalog::BinaryConfig::extra",
    "catalog::H265",
    "catalog::Json::tracks",
    "catalog::JsonConfig::extra",
    "catalog::Reference",
    "catalog::Text::renditions",
    "catalog::UnknownContainer",
    "catalog::UnknownProjection",
    "catalog::Video::enabled",
    "catalog::Video::renditions",
    "container::Frame::encode",
    "echo::Snapshot",
    "health::Health",
    "health::Limits",
    "health::PublisherThresholds::skipped",
    "health::Report",
    "health::Sample",
    "health::TransportThresholds::headroom",
    "health::TransportThresholds::loss",
    "health::TransportThresholds::rtt",
    "health::ViewerThresholds::errors",
    "health::ViewerThresholds::late",
    "health::ViewerThresholds::stalled",
    "health::publisher",
    "health::viewer",
    "stats::Snapshot",
]

[crates.hang.rename]
# The rule makes its accessors, such as `audio`, the `catalog` module's types:
# `moq_catalog_audio`.
"Catalog" = "hang_catalog"
# The rule names this and moq-net's `Error` alike.
"Error" = "hang_error"
# The rule makes both these enums and the `kind` methods of `AudioCodec` and `VideoCodec`
# `moq_catalog_<audio|video>_codec_kind`.
"catalog::AudioCodecKind" = "audio_codec_kind"
"catalog::VideoCodecKind" = "video_codec_kind"

