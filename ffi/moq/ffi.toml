# What the export refuses at the pinned revision, by paths from the stand-in facade that
# `just ffi standin` writes, as `just ffi census` lists it: the API a hand-written wrapper
# still has to cover. `kio` is moq-net's re-export of all of kio, of which moq-ffi ships
# only what the facade re-exports.
exclude = [
    "bytes",
    "clock::Deadlines::enter",
    "clock::Entered",
    "clock::Rng",
    "clock::rng",
    "hang::moq_net",
    "kio",
    "moq_quic::VarInt::from_u64_unchecked",
    "moq_tokio::accept::Failure::classify",
    "moq_tokio::accept::Health::failed",
    "moq_tokio::quic::demux::Datagram::local",
    "moq_tokio::quic::driver::connection::Connection::congestion_state",
    "moq_tokio::quic::driver::connection::Connection::poll_closed",
