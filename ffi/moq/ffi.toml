[crates.moq-mux.rename]
# The rule names these and moq-net's `Error`, and hang's `container::Frame` and
# `catalog::Consumer`, alike.
"Error" = "mux_error"
"container::Frame" = "mux_container_frame"
"catalog::Consumer" = "mux_catalog_consumer"
# The rule makes both this constant and `CatalogFormat`'s `Default` `moq_catalog_catalog_format_default`.
"catalog::CatalogFormat::DEFAULT" = "catalog_catalog_format_fallback"
# The rule makes this media clock's methods, such as `now`, kio's clock's: `moq_clock_now`.
"Clock" = "mux_clock"
# The rule makes both this constant and the method `Clock::timescale` `moq_mux_clock_timescale`.
"Clock::TIMESCALE" = "mux_clock_fixed_timescale"
# The rule makes each of these functions and its module's `Config` `moq_codec_<codec>_config`.
"codec::aac::config" = "codec_aac_audio_config"
"codec::mp3::config" = "codec_mp3_audio_config"
"codec::opus::config" = "codec_opus_audio_config"
# The rule makes these methods and the variants' tags `moq_container_fmp4_chunk_<variant>`.
"container::fmp4::Chunk::init" = "container_fmp4_chunk_into_init"
"container::fmp4::Chunk::fragment" = "container_fmp4_chunk_into_fragment"

# The waiter a driver's poll registers, which C makes from its waker and holds across polls,
# and the clock it polls at.
[crates.kio]
exclude = [
    "Bridge",
    "Closed",
    "Consumer",
    "ConsumerWeak",
    "Lock",
    "LockGuard",
    "Mut",
    "Park::hold",
    "Pending",
    "Producer",
    "ProducerWeak",
    "PushError",
    "Queue",
    "Ref",
    "Shared",
    "Task",
    "TaskKey",
    "Tasks",
    "Unwanted",
    "Waiter::batch",
    "Waiter::context",
    "Waiter::poll_future",
    "Waiter::waker",
    "Weak",
    "clock::Deadline::poll",
    "clock::Deadlines::enter",
    "clock::Elapsed",
    "clock::Entered",
    "clock::Instant::from_std",
    "clock::Instant::into_std",
    "clock::OutOfRange",
    "clock::Sleep",
    "clock::Timeout",
    "clock::drive",
    "clock::timeout",
    "clock::timeout_at",
    "coop::Budget::poll_yield",
    "log::Evicted",
    "log::Read",
    "log::Reader",
    "log::Writer",
    "machine",
    "wait",
]

[crates.kio.rename]
# The rule makes both this function and the type `clock::Wall` `moq_clock_wall`.
"clock::wall" = "clock_now_wall"
# The rule makes both this function and the type `clock::Interval` `moq_clock_interval`.
"clock::interval" = "clock_interval_every"
