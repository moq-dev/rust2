name: Nightly

# The gates too slow for a pull request. A failure lands on main rather than in
# review, which is the accepted trade; anything that must block a merge belongs
# in `just ci`.

permissions:
  contents: read

on:
  schedule:
    - cron: "17 6 * * *"
  workflow_dispatch:

concurrency:
  group: nightly-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # The full check over every module, catching what a merge group's diff-scoped
  # `just ci` let into main.
  gate:
    name: Gate
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 60

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: ./.github/actions/nix

      - name: Gate
        run: nix develop --command just gate

  ts:
    name: TypeScript package
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 60

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: ./.github/actions/nix

      # The package moq consumes as a flake input.
      - name: Build
        run: nix build .#ts

      # The fixtures against std checked in their own target directories, as outside Nix,
      # whose snapshots hold the flake's sysroot to the same output.
      - name: Fixtures without the sysroot
        run: nix develop --command env RUST2_TS_SYSROOT= just ts test --test fixtures

      # WebCodecs' encoder both ways in headless Chromium, which only the bench shell
      # carries, against the same build as the step before.
      - name: Encoder in Chromium
        run: nix develop .#bench --command env RUST2_TS_SYSROOT= just ts test --test fixtures -- --ignored --exact encoder

  bench:
    name: Benchmark
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 60

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: ./.github/actions/nix

      # Every route in Node, Bun, Chrome, and Firefox. The numbers go in the run's summary: no
      # threshold fails the job.
      - name: Bench
        run: nix develop .#bench --command just ts bench

      - name: Summary
        run: cat ts/target/bench/report.md >> "$GITHUB_STEP_SUMMARY"

  # moq's API on each target moq ships a binding to but the export's host, which the export
  # merges into one binding: each staged where its C toolchain is, which moq's build scripts
  # need even for a check. Linux's job takes Android's from the runner image's NDK.
  ffi-api:
    name: Stage moq's API (${{ matrix.name }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Linux and Android
            os: ubuntu-24.04
            targets: x86_64-unknown-linux-gnu aarch64-linux-android armv7-linux-androideabi x86_64-linux-android
          - name: Apple
            os: macos-latest
            targets: aarch64-apple-darwin x86_64-apple-darwin aarch64-apple-ios aarch64-apple-ios-sim x86_64-apple-ios
          - name: Windows
            os: windows-latest
            targets: x86_64-pc-windows-msvc
    defaults:
      run:
        shell: bash

    steps:
      # ffi/rust-toolchain.toml links to ts/'s.
      - name: Symlinks
        if: runner.os == 'Windows'
        run: git config --global core.symlinks true

      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - if: runner.os == 'Linux'
        uses: ./.github/actions/nix

      # Elsewhere no Nix, as the C++ job: the runner's rustup installs rust-toolchain.toml's
      # channel, and the targets it lacks.
      - name: Install just
        if: runner.os != 'Linux'
        uses: taiki-e/install-action@3a3daafd3b7f23b8f65d9f5ba2db203fb59b79e2 # v2.90.2
        with:
          tool: just

      - name: Targets
        if: runner.os != 'Linux'
        working-directory: ffi
        run: |
          read -ra targets <<< "$TARGETS"
          rustup target add "${targets[@]}"
        env:
          TARGETS: ${{ matrix.targets }}

      - name: Stage
        run: |
          read -ra targets <<< "$TARGETS"
          for target in "${targets[@]}"; do
            if [ "$RUNNER_OS" = Linux ]; then
              nix develop .#android --command just ffi moq-api "$target"
            else
              just ffi moq-api "$target"
            fi
          done
        env:
          TARGETS: ${{ matrix.targets }}

      - name: Upload
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: ffi-api-${{ runner.os }}
          path: ffi/target/moq-api
          if-no-files-found: error

  ffi:
    name: Export moq-net to C
    needs: ffi-api
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 60

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: ./.github/actions/nix

      - name: Download
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: ffi-api-*
          path: ffi/target/moq-api
          merge-multiple: true

      # moq's pub API at the pinned moq revision on every target moq ships, merged into one
      # binding, which fails on an item two targets define differently; built for the host,
      # and driven from each language.
      - name: Export
        run: nix develop --command just ffi moq

      # Every sampled type shape round-tripped in every language; the gate runs a subset.
      - name: Shapes
        run: nix develop --command just ffi shapes

      # What exports, and every refusal, ranked.
      - name: Census
        run: nix develop --command just ffi census

      - name: Summarize
        run: awk 'FNR == 1 { refused = 0 } /^## Refused items/ { refused = 1 } !refused' ffi/target/census/*.md >> "$GITHUB_STEP_SUMMARY"

      - name: Upload
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: ffi-census
          path: ffi/target/census

      # The C++ header again with Clang, at each standard and with exceptions and RTTI on
      # and off. C stays GCC's, so the export the steps above built stays fresh.
      - name: Clang
        run: nix develop .#clang --command bash -c 'export CC=gcc; just ffi test cpp && just ffi moq-cpp'

  # The api fixture's C and C++ scripts against glue built under AddressSanitizer and
  # ThreadSanitizer, and its C ABI driven from Rust under Miri.
  ffi-sanitize:
    name: Export to C under sanitizers and Miri
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 60

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: ./.github/actions/nix

      - name: Sanitize
        run: nix develop .#sanitize --command just ffi sanitize

  # The C++ header with the compilers the job above lacks, through the same checks, the
  # Python on the platforms the job above lacks, and on macOS the Swift with Apple's
  # toolchain.
  ffi-cpp:
    name: Export moq-net to C++ (${{ matrix.name }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: MSVC
            os: windows-latest
          - name: Apple Clang
            os: macos-latest
    defaults:
      run:
        shell: bash

    steps:
      # ffi/rust-toolchain.toml links to ts/'s.
      - name: Symlinks
        if: runner.os == 'Windows'
        run: git config --global core.symlinks true

      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # No Nix: its dev shell would replace the system compiler under test. The runner's
      # rustup installs rust-toolchain.toml's channel.
      - name: Install just
        uses: taiki-e/install-action@3a3daafd3b7f23b8f65d9f5ba2db203fb59b79e2 # v2.90.2
        with:
          tool: just

      # What a developer prompt sets for cl. VCINSTALLDIR stays unset, so rustc still finds
      # its linker itself rather than Git's link.exe on PATH.
      - name: MSVC
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $vs = & "${env:ProgramFiles(x86)}\Microsoft Visual Studio\Installer\vswhere.exe" -latest -property installationPath
          & "$vs\Common7\Tools\Launch-VsDevShell.ps1" -Arch amd64 -HostArch amd64 -SkipAutomaticLocation
          foreach ($name in 'INCLUDE', 'LIB', 'LIBPATH', 'PATH') {
            "$name=$((Get-Item "env:$name").Value)" >> $env:GITHUB_ENV
          }

      - name: Test
        run: just ffi test cpp

      # The Python, on the runner's CPython, which Windows names `python`: its proactor
      # loop reads wakes through a task rather than a reader callback.
      - name: Python
        run: just ffi test python
        env:
          PYTHON: ${{ runner.os == 'Windows' && 'python' || 'python3' }}

      - name: Export
        run: just ffi moq-cpp

      # The Swift through the checks the merge gate runs with nixpkgs' Swift on Linux, then
      # moq's session, reusing the builds above.
      - name: Swift
        if: runner.os == 'macOS'
        run: just ffi test swift && just ffi moq-swift

  # The Kotlin on ART, shrunk by R8 as an app shrinks it. x86_64, as moq's Android build:
  # this image ships the Android SDK and NDK, and its KVM runs an x86_64 emulator at speed.
  ffi-android:
    name: Export to Kotlin on Android
    runs-on: ubuntu-24.04
    timeout-minutes: 60

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: ./.github/actions/nix

      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      # The oldest API level moq's Android library supports, then the one it compiles
      # against. The second reuses the first's builds.
      - name: API 24
        uses: reactivecircus/android-emulator-runner@a421e43855164a8197daf9d8d40fe71c6996bb0d # v2.38.0
        with:
          api-level: 24
          arch: x86_64
          script: nix develop .#android --command just ffi android

      - name: API 35
        uses: reactivecircus/android-emulator-runner@a421e43855164a8197daf9d8d40fe71c6996bb0d # v2.38.0
        with:
          api-level: 35
          arch: x86_64
          script: nix develop .#android --command just ffi android

  ffi-bench:
    name: Bench the bindings
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 90

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: ./.github/actions/nix

      # The binding benchmark's tables go in the run's summary: no threshold fails the job.
      - name: Bench
        # Named, so a failing bench fails the pipe.
        shell: bash
        run: nix develop .#bench --command just ffi bench | tee -a "$GITHUB_STEP_SUMMARY"

  census:
    name: Census moq-net and kio
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 60

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: ./.github/actions/nix

      # Every construct translation refuses, at the pinned moq revision.
      - name: Census
        run: nix develop --command just ts census

      # The ranked tables: the spans would pass the summary's size limit.
      - name: Summarize
        run: awk 'FNR == 1 { spans = 0 } /^## Spans/ { spans = 1 } !spans' ts/target/census/moq-net.md ts/target/census/model.md ts/target/census/kio.md >> "$GITHUB_STEP_SUMMARY"

      - name: Upload
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: census
          path: ts/target/census

  # Every driver on the newest nightly rust-overlay names, so the next bump's breaks are
  # known before it starts. It fails no merge and opens no issue: the report waits on
  # every job but this one. Each module runs after another's failure.
  canary:
    name: Newest nightly
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 90
    continue-on-error: true

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: ./.github/actions/nix

      - name: Toolchain
        id: toolchain
        run: |
          channel=$(sh/canary.sh)
          echo "Canary on \`$channel\`" >> "$GITHUB_STEP_SUMMARY"

      - name: Driver
        if: ${{ !cancelled() && steps.toolchain.outcome == 'success' }}
        run: nix develop --command bash -c 'just driver check && just driver test'

      - name: Export
        if: ${{ !cancelled() && steps.toolchain.outcome == 'success' }}
        run: nix develop --command bash -c 'just ffi check && just ffi test'

      - name: Go
        if: ${{ !cancelled() && steps.toolchain.outcome == 'success' }}
        run: nix develop --command bash -c 'just go check && just go test'

      - name: TypeScript
        if: ${{ !cancelled() && steps.toolchain.outcome == 'success' }}
        run: nix develop --command bash -c 'just ts check && just ts moq && just ts test'

  # A scheduled run's failure opens one issue, or comments on the one still open, and a
  # pass closes it, so a suite only this workflow runs cannot fail unseen. Only the
  # schedule, which runs main, gets the write token: a dispatch can run any branch.
  report:
    name: Report
    needs: [gate, ts, bench, ffi-api, ffi, ffi-sanitize, ffi-cpp, ffi-android, ffi-bench, census]
    if: ${{ !cancelled() && github.event_name == 'schedule' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      issues: write

    steps:
      - name: Issue
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          FAILED: ${{ contains(needs.*.result, 'failure') }}
          RUN: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          SHA: ${{ github.sha }}
        run: |
          title="The nightly fails"
          issue=$(gh issue list --state open --search "\"$title\" in:title" --json number,title --jq ".[] | select(.title == \"$title\") | .number" | head -n 1)
          if [ "$FAILED" = true ]; then
            body="[This run]($RUN) failed at $SHA."
            if [ -n "$issue" ]; then
              gh issue comment "$issue" --body "$body"
            else
              gh issue create --title "$title" --body "$body"
            fi
          elif [ -n "$issue" ]; then
            gh issue close "$issue" --comment "[This run]($RUN) passed at $SHA."
          fi
