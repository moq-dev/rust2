name: Nightly

# The gates too slow for a pull request. A failure lands on main rather than in
# review, which is the accepted trade; anything that must block a merge belongs
# in check.yml.

permissions:
  contents: read

on:
  schedule:
    - cron: "17 6 * * *"
  workflow_dispatch:

concurrency:
  group: nightly-${{ github.ref }}
  cancel-in-progress: true

jobs:
  moq:
    name: Translate moq-net
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 60

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: ./.github/actions/nix

      # moq-net's codec at the pinned moq revision, translated and type-checked.
      - name: Translate
        run: nix develop --command just ts moq

      # The package moq consumes as a flake input.
      - name: Build
        run: nix build .#ts

      # The fixtures against std checked in their own target directories, as outside Nix,
      # whose snapshots hold the flake's sysroot to the same output.
      - name: Fixtures without the sysroot
        run: nix develop --command env RUST2_TS_SYSROOT= just ts test --test fixtures

  uniffi-fixtures:
    name: UniFFI fixtures
    # x86_64: nixpkgs marks Swift 6.3 broken on aarch64-linux, where it fails to link with
    # gold. Swift 6.4 links with LLD and lifts the mark once it reaches nixpkgs-unstable.
    runs-on: ubuntu-24.04
    timeout-minutes: 90

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: ./.github/actions/nix

      # Kotlin, Swift, Python, and Dart run under cargo; Go and C++ run their own harness.
      - name: Fixtures
        run: nix develop .#uniffi --command just uniffi fixtures

  # The Linux job above builds the C and C++ fixtures with GCC; consumers also build them
  # with these. Each standard reuses the job's one Rust build.
  uniffi-cpp:
    name: UniFFI C and C++ (${{ matrix.name }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: MSVC
            os: windows-latest
          - name: Apple Clang
            os: macos-latest
    defaults:
      run:
        shell: bash

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # No Nix: its dev shell would replace the system compiler under test. The runner's
      # rustup installs rust-toolchain.toml's channel. The suite also builds its expected-style
      # and C consumers without exceptions or RTTI.
      - name: C++17
        run: |
          cmake -S uniffi/cpp/cpp-tests -B target/cpp17 -DCMAKE_BUILD_TYPE=Debug
          cmake --build target/cpp17 --config Debug --parallel
          ctest --test-dir target/cpp17 -C Debug --output-on-failure

      - name: C++20
        run: |
          cmake -S uniffi/cpp/cpp-tests -B target/cpp20 -DCMAKE_BUILD_TYPE=Debug -DCMAKE_CXX_STANDARD=20
          cmake --build target/cpp20 --config Debug --parallel
          ctest --test-dir target/cpp20 -C Debug --output-on-failure

  uniffi-install:
    name: UniFFI install
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 60

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: ./.github/actions/nix

      # A consumer's `cargo install` ignores the lockfile, so resolve it fresh.
      - name: Install
        run: nix develop --command just uniffi install

      - name: Symlink
        run: nix develop --command just uniffi symlink

      # The flake packages moq pins.
      - name: Build
        run: nix build .#uniffi

  bench:
    name: Benchmark
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 60

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: ./.github/actions/nix

      # Every route in Node, Bun, Chrome, and Firefox. The numbers go in the run's summary: no
      # threshold fails the job.
      - name: Bench
        run: nix develop .#bench --command just ts bench

      - name: Summary
        run: cat ts/target/bench/report.md >> "$GITHUB_STEP_SUMMARY"

  ffi:
    name: Export moq-net to C
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 60

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: ./.github/actions/nix

      # moq-net's pub API at the pinned moq revision, exported, built, and driven from C.
      - name: Export
        run: nix develop --command just ffi moq

      # What exports, and every refusal, ranked.
      - name: Census
        run: nix develop --command just ffi census

      - name: Summarize
        run: awk 'FNR == 1 { refused = 0 } /^## Refused items/ { refused = 1 } !refused' ffi/target/census/*.md >> "$GITHUB_STEP_SUMMARY"

      - name: Upload
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: ffi-census
          path: ffi/target/census

      # The C++ header again with Clang, at each standard and with exceptions and RTTI on
      # and off. C stays GCC's, so the export the steps above built stays fresh.
      - name: Clang
        run: nix develop .#clang --command bash -c 'export CC=gcc; just ffi test cpp && just ffi moq-cpp'

  # The C++ header with the compilers the job above lacks, through the same checks, and on
  # macOS the Swift with Apple's toolchain.
  ffi-cpp:
    name: Export moq-net to C++ (${{ matrix.name }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: MSVC
            os: windows-latest
          - name: Apple Clang
            os: macos-latest
    defaults:
      run:
        shell: bash

    steps:
      # ffi/rust-toolchain.toml links to ts/'s.
      - name: Symlinks
        if: runner.os == 'Windows'
        run: git config --global core.symlinks true

      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # No Nix: its dev shell would replace the system compiler under test. The runner's
      # rustup installs rust-toolchain.toml's channel.
      - name: Install just
        uses: taiki-e/install-action@86f7a0ffb25f40114606501a311ebcfaf882ea32 # v2.88.0
        with:
          tool: just

      # What a developer prompt sets for cl. VCINSTALLDIR stays unset, so rustc still finds
      # its linker itself rather than Git's link.exe on PATH.
      - name: MSVC
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $vs = & "${env:ProgramFiles(x86)}\Microsoft Visual Studio\Installer\vswhere.exe" -latest -property installationPath
          & "$vs\Common7\Tools\Launch-VsDevShell.ps1" -Arch amd64 -HostArch amd64 -SkipAutomaticLocation
          foreach ($name in 'INCLUDE', 'LIB', 'LIBPATH', 'PATH') {
            "$name=$((Get-Item "env:$name").Value)" >> $env:GITHUB_ENV
          }

      - name: Test
        run: just ffi test cpp

      - name: Export
        run: just ffi moq-cpp

      # The Swift through the checks the merge gate runs with nixpkgs' Swift on Linux, then
      # moq's session, reusing the builds above.
      - name: Swift
        if: runner.os == 'macOS'
        run: just ffi test swift && just ffi moq-swift

  # The Kotlin on ART, shrunk by R8 as an app shrinks it. x86_64, as moq's Android build:
  # this image ships the Android SDK and NDK, and its KVM runs an x86_64 emulator at speed.
  ffi-android:
    name: Export to Kotlin on Android
    runs-on: ubuntu-24.04
    timeout-minutes: 60

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: ./.github/actions/nix

      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      # The oldest API level moq's Android library supports, then the one it compiles
      # against. The second reuses the first's builds.
      - name: API 24
        uses: reactivecircus/android-emulator-runner@a421e43855164a8197daf9d8d40fe71c6996bb0d # v2.38.0
        with:
          api-level: 24
          arch: x86_64
          script: nix develop .#android --command just ffi android

      - name: API 35
        uses: reactivecircus/android-emulator-runner@a421e43855164a8197daf9d8d40fe71c6996bb0d # v2.38.0
        with:
          api-level: 35
          arch: x86_64
          script: nix develop .#android --command just ffi android

  ffi-bench:
    name: Bench the C export against moq-c
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 90

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: ./.github/actions/nix

      # Frame writes through each C API. The numbers go in the run's summary: no threshold
      # fails the job.
      - name: Bench
        # Named, so a failing bench fails the pipe.
        shell: bash
        run: nix develop .#bench --command just ffi bench | tee -a "$GITHUB_STEP_SUMMARY"

  census:
    name: Census moq-net and kio
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 60

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: ./.github/actions/nix

      # Every construct translation refuses, at the pinned moq revision.
      - name: Census
        run: nix develop --command just ts census

      # The ranked tables: the spans would pass the summary's size limit.
      - name: Summarize
        run: awk 'FNR == 1 { spans = 0 } /^## Spans/ { spans = 1 } !spans' ts/target/census/moq-net.md ts/target/census/model.md ts/target/census/kio.md >> "$GITHUB_STEP_SUMMARY"

      - name: Upload
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: census
          path: ts/target/census
