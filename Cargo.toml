resolver = "2"

[workspace.lints.clippy]
# Every suppression says why, so the next lint audit can judge it. The UniFFI fork's
# crates do not inherit this: they keep upstream's lints, so cherry-picks apply unchanged.
allow_attributes_without_reason = "warn"

# The UniFFI fork's fixtures depend on its crates through the workspace, as upstream's do.
[workspace.dependencies]
uniffi = { path = "uniffi/uniffi", version = "=0.1.0" }
uniffi_bindgen = { path = "uniffi/uniffi_bindgen", version = "=0.1.0" }
uniffi_core = { path = "uniffi/uniffi_core", version = "=0.1.0" }
uniffi_macros = { path = "uniffi/uniffi_macros", version = "=0.1.0" }
uniffi_build = { path = "uniffi/uniffi_build", version = "=0.1.0" }
uniffi_meta = { path = "uniffi/uniffi_meta", version = "=0.1.0" }
uniffi_testing = { path = "uniffi/uniffi_testing", version = "=0.1.0" }
uniffi_udl = { path = "uniffi/uniffi_udl", version = "=0.1.0" }
